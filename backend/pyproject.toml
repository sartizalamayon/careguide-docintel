[project]
name = "docintel"
version = "0.1.0"
description = "CareGuide DocIntel - AI document intelligence API and workers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.35",
    "python-multipart>=0.0.18,<0.1",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<1.17",
    "psycopg[binary]>=3.2,<3.3",
    "pgvector>=0.3.6,<0.5",
    "celery[redis]>=5.4,<5.6",
    "redis>=5.2,<6",
    "pydantic>=2.10,<2.12",
    "pydantic-settings>=2.6,<2.10",
    "pymupdf>=1.25,<1.27",
    "pytesseract>=0.3.13,<0.4",
    "opencv-python-headless>=4.10,<4.12",
    "pillow>=11,<12",
    "numpy>=2.1,<2.3",
    "pandas>=2.2,<2.3",
    "openpyxl>=3.1.5,<3.2",
    "xlrd>=2.0.1,<2.1",
    "charset-normalizer>=3.4,<4",
    "openai>=1.60,<2",
    "tenacity>=9.0,<10",
    "rapidfuzz>=3.10,<4",
    "fastembed>=0.5,<0.8",
    "structlog>=24.4,<26",
    "httpx>=0.28,<0.29",
    "cryptography>=44,<47",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.8,<0.13",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert in tests

[tool.ruff.lint.per-file-ignores]
"app/api/**" = ["B008"]  # FastAPI Depends/Query/File defaults are the idiom
"tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
