name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: docintel, POSTGRES_PASSWORD: docintel, POSTGRES_DB: docintel }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docintel" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      API_KEY: ci-test-key-0123456789
      DATABASE_URL: postgresql+psycopg://docintel:docintel@localhost:5432/docintel
      REDIS_URL: redis://localhost:6379/0
      STORAGE_DIR: /tmp/uploads
      EMBEDDING_CACHE_DIR: /tmp/models
      CELERY_TASK_ALWAYS_EAGER: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: pip install --require-hashes -r requirements.txt && pip install --require-hashes -r requirements-dev.txt
      - run: ruff check app tests
      - run: alembic upgrade head
      - run: pytest -q --cov=app --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
